name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the sign-off check below walks the pull request's own commits, and a shallow
      # clone does not contain them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every suite
        run: bin/test.sh

      # Every bash script, found rather than listed — the same reason bin/test.sh finds its suites.
      # Two selections, unioned, because neither is complete on its own: a shebang scan finds the
      # three scripts with no .sh extension and misses the helpers that are only ever sourced, which
      # have no shebang to find; a name scan finds those and misses the three. Selecting by shebang
      # alone is what left `guards/policy.sh`, `bin/check.sh` and `bin/tenant.sh` out of this sweep,
      # reached only as -x dependencies of the scripts that source them — so a finding in one was
      # reported against whichever caller happened to be checked, or not at all if the directive
      # above it named a different shell. Their `shell=bash` directives are what makes the second
      # selection work, the same way their `source=` directives serve the first.
      - name: shellcheck
        run: |
          mapfile -t scripts < <({
            git ls-files '*.sh' 'bin/*'
            git ls-files | while read -r f; do
              head -c 64 "$f" | grep -qE '^#!.*\b(bash|sh)\b' && printf '%s\n' "$f"
            done
          } | sort -u)
          # Printed, because which shellcheck judged the tree is part of what a green sweep means.
          # This runner's preinstalled copy and a current one disagree about the code for a helper
          # invoked only through an `eval` — SC2317 here, SC2329 from 0.10 on — so a suite's
          # directive names both and this line is how a reader knows which one answered.
          shellcheck --version | sed -n '2p'
          printf 'checking %d scripts\n' "${#scripts[@]}"
          shellcheck -x "${scripts[@]}"

      # The repository's own tenancy rule, applied to itself: nothing here may name a tenant, a
      # machine or an account, and no document may argue from one. --scan-tree reads the terms from
      # .protocol/tenant rather than from a document that then drifts, which is what makes this a
      # check instead of a review note. The tracked half carries only shapes and words — the proper
      # nouns are in the untracked overlay, so this step runs without them (ARCHITECTURE.md §3).
      - name: No tenant material in the tree
        run: guards/tenant-guard.sh --scan-tree

      # A step rather than a job, because this one has to be conditional and a conditional job
      # cannot be required: a job skipped by a job-level `if:` reports SKIPPED, and a required check
      # that reports SKIPPED blocks the merge forever. As a step it reports inside `test`, which is
      # required, so the condition costs nothing.
      - name: Developer Certificate of Origin sign-off
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while IFS=$'\t' read -r sha author signoff; do
            # Bots commit without a sign-off. A required check they cannot satisfy buys an
            # admin-bypass habit rather than a stronger guarantee — see CONTRIBUTING.md.
            [[ "$author" == *'[bot]' ]] && continue
            if [ -z "$signoff" ]; then
              echo "missing Signed-off-by: $sha ($author)"
              missing=1
            fi
          done < <(git log --format='%H%x09%an%x09%(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$BASE..$HEAD")
          if [ "$missing" = 1 ]; then
            echo
            echo "Every commit needs a Developer Certificate of Origin sign-off: git commit -s"
            echo "To fix a branch:  git rebase --signoff $BASE"
            exit 1
          fi

  # The same suites under the bash a tenant is as likely to be installed with. macOS ships 3.2 as
  # /bin/bash — a 2007 release, kept for licensing reasons — and BSD userland besides, and the two
  # bugs that prompted this job were a parameter expansion that works only from bash 4 on and a
  # `wc -l` whose count is padded here and not there. Neither could fail on ubuntu-latest, so a
  # protocol that installs itself on whatever machine a tenant has was tested on one kind of
  # machine.
  #
  # A separate job rather than a matrix on `test`: a matrix renames that job's check, and both
  # required checks are named for the job that reports them — `test` and `macos`. Only the suites run
  # here — shellcheck, the tenancy scan and the sign-off check are questions about the tree rather
  # than about the shell, and asking them twice buys nothing.
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      # Full history here too: bin/refutation.test.sh asks git whether each commit a refutation
      # entry names exists, and a shallow clone contains none of them — which that suite reports as
      # a failure rather than skipping, so the clone depth is part of what the job has to supply.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The bash a tenant may be installing with
        run: /bin/bash --version | head -1

      - name: Every suite
        run: bin/test.sh

  # A tag is a human-readable name for one commit, not a distribution: nothing is published to a
  # registry, so this cuts a GitHub release and stops. It needs no token beyond the run's own.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
